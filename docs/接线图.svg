<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">rom-watch 接线图：① ESP8266 + 0.96 寸 OLED 最小接线（4 根线）② 可选 TJC 串口屏接线</title>
  <desc id="svgDesc">图①（最小接线，4 根线）：OLED 的 VCC 接 ESP8266 的 3V3、GND 接 GND、SDA 接 D2、SCL 接 D1。图②（可选串口屏）：屏 TX 接板 D5、屏 RX 接板 D7、屏 GND 与板 GND 及独立电源负极三者共地、屏 VCC 接独立 5~12V 电源（不要从板上取电）。两图都醒目提示：串口屏的任何一根线都不要接 D6（GPIO12），那是 ESP8266 开机时判断 flash 电压的脚，接上可能直接起不来。</desc>

  <rect x="0" y="0" width="900" height="1010" fill="#f7f9fc"/>

  <g font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif">

    <!-- ==================== ① 最小接线 ==================== -->
    <rect x="20" y="20" width="860" height="480" rx="14" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
    <text x="44" y="58" font-size="28" font-weight="700" fill="#1f2d3d">① 最小接线：ESP8266 + 0.96″ OLED（只有 4 根线）</text>
    <text x="44" y="88" font-size="16" fill="#5b6b7c">★ 接完这 4 根就能跑；串口屏是可选的（见下面 ②）</text>

    <!-- 板子 -->
    <rect x="60" y="140" width="240" height="200" rx="10" fill="#eef3f9" stroke="#8fa6bf" stroke-width="2"/>
    <text x="180" y="176" font-size="20" font-weight="700" fill="#1f2d3d" text-anchor="middle">WeMos D1 mini</text>
    <text x="180" y="200" font-size="14" fill="#5b6b7c" text-anchor="middle">（ESP8266 开发板）</text>
    <text x="180" y="236" font-size="14" fill="#8fa6bf" text-anchor="middle">USB 口在另一头</text>
    <text x="180" y="258" font-size="14" fill="#8fa6bf" text-anchor="middle">（供电 + 烧录都靠它）</text>
    <text x="180" y="300" font-size="14" fill="#8fa6bf" text-anchor="middle">板上自带 LED 和 FLASH 键</text>
    <text x="180" y="322" font-size="14" fill="#8fa6bf" text-anchor="middle">不用额外接</text>

    <!-- 板子引脚 -->
    <rect x="300" y="170" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="328" y="193" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">3V3</text>
    <rect x="300" y="210" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="328" y="233" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">GND</text>
    <rect x="300" y="250" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="328" y="273" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">D1</text>
    <rect x="300" y="290" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="328" y="313" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">D2</text>

    <!-- OLED 模块 -->
    <rect x="596" y="140" width="254" height="200" rx="10" fill="#eef3f9" stroke="#8fa6bf" stroke-width="2"/>
    <text x="723" y="176" font-size="20" font-weight="700" fill="#1f2d3d" text-anchor="middle">0.96″ OLED</text>
    <text x="723" y="200" font-size="14" fill="#5b6b7c" text-anchor="middle">（SSD1306 · I2C · 地址 0x3C）</text>
    <text x="620" y="250" font-size="14" font-weight="700" fill="#c0392b">★ VCC 接 3V3，别接 5V</text>
    <text x="620" y="276" font-size="14" font-weight="700" fill="#c0392b">★ 按名字接，别按位置接</text>
    <text x="620" y="300" font-size="13" fill="#8fa6bf">（不同模块的 4 个脚顺序可能不一样）</text>
    <text x="620" y="324" font-size="13" fill="#8fa6bf">通电就会亮（不用先烧固件）</text>

    <!-- OLED 引脚 -->
    <rect x="540" y="170" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="568" y="193" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">VCC</text>
    <rect x="540" y="210" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="568" y="233" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">GND</text>
    <rect x="540" y="250" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="568" y="273" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">SCL</text>
    <rect x="540" y="290" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="568" y="313" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">SDA</text>

    <!-- 4 根线 -->
    <line x1="356" y1="186" x2="540" y2="186" stroke="#e05252" stroke-width="5" stroke-linecap="round"/>
    <line x1="356" y1="226" x2="540" y2="226" stroke="#4a5568" stroke-width="5" stroke-linecap="round"/>
    <line x1="356" y1="266" x2="540" y2="266" stroke="#2f7fd1" stroke-width="5" stroke-linecap="round"/>
    <line x1="356" y1="306" x2="540" y2="306" stroke="#2f9e5a" stroke-width="5" stroke-linecap="round"/>

    <!-- 线的标注 -->
    <text x="448" y="178" font-size="16" font-weight="700" fill="#c0392b" text-anchor="middle">3V3 → VCC</text>
    <text x="448" y="218" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">GND → GND</text>
    <text x="448" y="258" font-size="16" font-weight="700" fill="#2f7fd1" text-anchor="middle">D1 → SCL</text>
    <text x="448" y="298" font-size="16" font-weight="700" fill="#2f9e5a" text-anchor="middle">D2 → SDA</text>

    <!-- ★ D6 警告横幅 -->
    <rect x="40" y="360" width="820" height="54" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
    <text x="450" y="386" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">★ 串口屏的任何一根线都不要接 D6（GPIO12）</text>
    <text x="450" y="406" font-size="15" fill="#c0392b" text-anchor="middle">D6 是 ESP8266 开机时判断 flash 电压的脚 —— 被占着可能直接起不来（默认 D5/D7 已避开）</text>

    <text x="450" y="442" font-size="15" fill="#5b6b7c" text-anchor="middle">通电后屏上先出现「系统自检」页（连 WiFi 之前就能看到）—— 看到字就说明这 4 根线接对了</text>
    <text x="450" y="466" font-size="15" fill="#5b6b7c" text-anchor="middle">屏不亮 / 花屏：联网后在网页扫 I2C（/i2c 应看到 0x3C）；扫不到就试 OLED_ADDR 0x3D</text>
    <text x="450" y="490" font-size="15" fill="#5b6b7c" text-anchor="middle">完整排错（对号入座）见 docs/接线与适配.md 第 6 节</text>

    <!-- ==================== ② 可选串口屏 ==================== -->
    <rect x="20" y="520" width="860" height="470" rx="14" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
    <text x="44" y="558" font-size="28" font-weight="700" fill="#1f2d3d">② 可选接线：再加一块 TJC 串口屏（不接也能跑）</text>
    <text x="44" y="588" font-size="16" fill="#5b6b7c">★ 屏的电源必须独立（5~12V），只和板子共地</text>

    <!-- 板子 -->
    <rect x="60" y="620" width="210" height="180" rx="10" fill="#eef3f9" stroke="#8fa6bf" stroke-width="2"/>
    <text x="165" y="654" font-size="18" font-weight="700" fill="#1f2d3d" text-anchor="middle">WeMos D1 mini</text>
    <text x="165" y="676" font-size="13" fill="#5b6b7c" text-anchor="middle">（ESP8266）</text>
    <text x="165" y="742" font-size="13" fill="#8fa6bf" text-anchor="middle">板上自带 LED / FLASH 键</text>
    <text x="165" y="764" font-size="13" fill="#8fa6bf" text-anchor="middle">不用额外接</text>

    <!-- 板子引脚 -->
    <rect x="270" y="644" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="298" y="667" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">D5</text>
    <rect x="270" y="684" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="298" y="707" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">D7</text>
    <rect x="270" y="724" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="298" y="747" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">GND</text>
    <rect x="270" y="764" width="56" height="32" rx="5" fill="#fdecec" stroke="#d64545" stroke-width="3"/>
    <text x="298" y="787" font-size="19" font-weight="700" fill="#c0392b" text-anchor="middle">D6</text>

    <!-- D6 禁止标记（红框 + 下方红字说明） -->

    <!-- 串口屏 -->
    <rect x="410" y="620" width="250" height="180" rx="10" fill="#eef3f9" stroke="#8fa6bf" stroke-width="2"/>
    <text x="535" y="654" font-size="18" font-weight="700" fill="#1f2d3d" text-anchor="middle">TJC 串口屏</text>
    <text x="535" y="676" font-size="13" fill="#5b6b7c" text-anchor="middle">（可选 · 触摸屏）</text>
    <text x="535" y="726" font-size="13" fill="#8fa6bf" text-anchor="middle">开机自动探波特率</text>
    <text x="535" y="748" font-size="13" fill="#8fa6bf" text-anchor="middle">不用手动设</text>

    <!-- 屏左侧引脚 -->
    <rect x="360" y="644" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="388" y="667" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">TX</text>
    <rect x="360" y="684" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="388" y="707" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">RX</text>
    <rect x="360" y="724" width="56" height="32" rx="5" fill="#ffffff" stroke="#8fa6bf" stroke-width="2"/>
    <text x="388" y="747" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">GND</text>
    <!-- 屏右侧引脚 -->
    <rect x="660" y="644" width="56" height="32" rx="5" fill="#fff5e6" stroke="#e08a1e" stroke-width="3"/>
    <text x="688" y="667" font-size="19" font-weight="700" fill="#b06a00" text-anchor="middle">VCC</text>

    <!-- 独立电源 -->
    <rect x="760" y="620" width="110" height="110" rx="10" fill="#fff5e6" stroke="#e08a1e" stroke-width="2"/>
    <text x="815" y="652" font-size="15" font-weight="700" fill="#b06a00" text-anchor="middle">独立电源</text>
    <text x="815" y="680" font-size="17" font-weight="700" fill="#b06a00" text-anchor="middle">5~12V</text>
    <text x="815" y="706" font-size="13" fill="#b06a00" text-anchor="middle">（充电头）</text>
    <text x="815" y="754" font-size="13" font-weight="700" fill="#b06a00" text-anchor="middle">约 420mA @5V</text>
    <text x="815" y="776" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">★ 别从板上取电</text>

    <!-- 信号线：D5↔TX、D7↔RX -->
    <line x1="326" y1="660" x2="360" y2="660" stroke="#2f9e5a" stroke-width="5" stroke-linecap="round"/>
    <line x1="326" y1="700" x2="360" y2="700" stroke="#2f7fd1" stroke-width="5" stroke-linecap="round"/>
    <!-- 电源线：独立电源 → 屏 VCC -->
    <line x1="716" y1="660" x2="760" y2="660" stroke="#e08a1e" stroke-width="5" stroke-linecap="round"/>
    <!-- 共地母线 -->
    <line x1="340" y1="906" x2="815" y2="906" stroke="#4a5568" stroke-width="5" stroke-linecap="round"/>
    <line x1="326" y1="740" x2="340" y2="740" stroke="#4a5568" stroke-width="5"/>
    <line x1="340" y1="740" x2="340" y2="906" stroke="#4a5568" stroke-width="5"/>
    <line x1="360" y1="740" x2="360" y2="906" stroke="#4a5568" stroke-width="5"/>
    <line x1="815" y1="730" x2="815" y2="906" stroke="#4a5568" stroke-width="5"/>
    <circle cx="340" cy="906" r="7" fill="#4a5568"/>
    <circle cx="360" cy="906" r="7" fill="#4a5568"/>
    <circle cx="815" cy="906" r="7" fill="#4a5568"/>

    <!-- 图例 -->
    <rect x="400" y="804" width="300" height="88" rx="8" fill="#f4f7fb" stroke="#d7e0ea" stroke-width="2"/>
    <rect x="416" y="818" width="14" height="14" rx="3" fill="#2f9e5a"/>
    <text x="440" y="830" font-size="14" fill="#1f2d3d">板 D5 ↔ 屏 TX</text>
    <rect x="416" y="836" width="14" height="14" rx="3" fill="#2f7fd1"/>
    <text x="440" y="848" font-size="14" fill="#1f2d3d">板 D7 ↔ 屏 RX（别接成 TX→TX）</text>
    <rect x="416" y="854" width="14" height="14" rx="3" fill="#4a5568"/>
    <text x="440" y="866" font-size="14" fill="#1f2d3d">三者共地：板 GND / 屏 GND / 电源 −</text>
    <rect x="416" y="872" width="14" height="14" rx="3" fill="#e08a1e"/>
    <text x="440" y="884" font-size="14" fill="#1f2d3d">独立 5~12V → 屏 VCC</text>

    <!-- ★ D6 警告框 -->
    <rect x="40" y="804" width="250" height="88" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
    <text x="165" y="834" font-size="17" font-weight="700" fill="#c0392b" text-anchor="middle">★ 不要接 D6（GPIO12）</text>
    <text x="165" y="860" font-size="14" fill="#c0392b" text-anchor="middle">接上可能直接起不来</text>
    <text x="165" y="882" font-size="13" fill="#c0392b" text-anchor="middle">（默认 D5 / D7 已避开它）</text>

    <text x="450" y="942" font-size="15" fill="#5b6b7c" text-anchor="middle">屏的波特率开机自动探测（115200 / 9600 / 19200 / 57600 / 38400 / 230400），不用手动设</text>
    <text x="450" y="968" font-size="15" fill="#5b6b7c" text-anchor="middle">屏一个字都不回：先把 D5–D7 短接跑 /tjcwire 体检 —— 见 docs/接线与适配.md 第 6 节</text>

  </g>
</svg>
